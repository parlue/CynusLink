name: One-shot startup flip patch

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == 'RUN_ONE_SHOT_STARTUP_FLIP_20260820'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply isolated startup flip safeguard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main.cpp')
          s = p.read_text()
          old = '''                            boardSyncRequestPending=false;
                            boardScanPending=false;
                            startupFreshFenExpected=false;
                            startupCorrectionMode=false;
                            fenNow=bufferedFen;
                            boardSynced=true;
'''
          new = '''                            if (orientation == 1) {
                                if (!sendCynus("set flip board on\\n")) {
                                    Serial.println("[STARTUP] flipped initial position detected, but flip board ON failed; startup remains gated");
                                    startupFreshFenExpected=false;
                                    startupCorrectionMode=true;
                                    continue;
                                }
                                firstMoveFlipOn=true;
                                Serial.println("[STARTUP] flipped initial position detected -> flip board ON sent; first-move gate remains active");
                            }

                            boardSyncRequestPending=false;
                            boardScanPending=false;
                            startupFreshFenExpected=false;
                            startupCorrectionMode=false;
                            fenNow=bufferedFen;
                            boardSynced=true;
'''
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'refusing patch: target count={count}, expected 1')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/main.cpp
      - name: Commit isolated fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.cpp
          git commit -m 'fix: send startup flip on for flipped initial position'
          git push origin HEAD:main
