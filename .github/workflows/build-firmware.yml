name: Build CynusLink firmware

on:
  push:
    branches: [ main ]
    paths:
      - 'src/main.cpp'
      - 'platformio.ini'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply strict startup display flow
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/main.cpp')
          s = p.read_text()
          changed = False

          def replace_once(old, new, label):
              global s, changed
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
                  print('patched:', label)
              elif new in s:
                  print('already patched:', label)
              else:
                  raise SystemExit(f'Patch anchor not found: {label}')

          # Do not claim we are scanning for ChessLink immediately after Cynus connects.
          replace_once(
              '    Serial.printf("[CYNUS] connected %s\\n", cynusDev->getName().c_str());\n    cynusDisplay("search");\n',
              '    Serial.printf("[CYNUS] connected %s\\n", cynusDev->getName().c_str());\n    Serial.println("[DISPLAY] waiting for a valid initial board before ChessLink scan");\n',
              'no BT scan display before board validation')

          # A valid normal startup position is the point where ChessLink advertising starts.
          replace_once(
              '                        if (!clConnected) {\n                            setState(WAIT_CHESSLINK);\n                            cynusDisplay("search");\n                            startChessLinkAdvertising();\n',
              '                        if (!clConnected) {\n                            setState(WAIT_CHESSLINK);\n                            cynusDisplay("BT Scan");\n                            Serial.println("[DISPLAY] BT Scan: valid board confirmed, scanning for ChessLink");\n                            startChessLinkAdvertising();\n',
              'normal startup BT Scan display')

          # ChessLink connected: display Connect until Cynus confirms external mode.
          replace_once(
              '            cynusDisplay("ready");\n            Serial.println("[DISPLAY] READY held until Cynus confirms external-engine mode");\n',
              '            cynusDisplay("Connect");\n            Serial.println("[DISPLAY] CONNECT held until Cynus confirms external-engine mode");\n',
              'ready to Connect')

          # On ChessLink loss, do not show BT Scan before the recovery board scan succeeds.
          replace_once(
              '    if (cynusReady) {\n        displayPlayPending = false;\n        cynusDisplay("search");\n    }\n    stopChessLinkAdvertising();\n',
              '    if (cynusReady) {\n        displayPlayPending = false;\n        Serial.println("[DISPLAY] ChessLink lost; validating board before restarting BT scan");\n    }\n    stopChessLinkAdvertising();\n',
              'recovery board validation before BT Scan')

          # Flipped startup: do not show BT Scan while still waiting for Cynus get move.
          replace_once(
              '            stopChessLinkAdvertising();\n            cynusDisplay("search");\n            Serial.println("[STARTPOS] flipped boot position accepted; waiting for Cynus get move before ChessLink");\n',
              '            stopChessLinkAdvertising();\n            Serial.println("[STARTPOS] flipped boot position accepted; waiting for Cynus get move before ChessLink");\n',
              'flipped gate no premature BT Scan')

          # Once flipped startup is actually ready to expose ChessLink, show BT Scan.
          replace_once(
              '        setState(WAIT_CHESSLINK);\n        setMoveCycle(WAIT_ENGINE_MOVE);\n        cynusDisplay("search");\n        startChessLinkAdvertising();\n',
              '        setState(WAIT_CHESSLINK);\n        setMoveCycle(WAIT_ENGINE_MOVE);\n        cynusDisplay("BT Scan");\n        Serial.println("[DISPLAY] BT Scan: flipped board valid and Cynus ready");\n        startChessLinkAdvertising();\n',
              'flipped startup BT Scan display')

          if changed:
              p.write_text(s)
          PY

          if ! git diff --quiet -- src/main.cpp; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/main.cpp
            git commit -m 'Require valid board before ChessLink scan [skip ci]'
            git push
          fi

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e esp32-s3-devkitc-1

      - name: Prepare Web Flasher files
        run: |
          cp .pio/build/esp32-s3-devkitc-1/firmware.bin docs/CynusLink-firmware.bin
          cp .pio/build/esp32-s3-devkitc-1/bootloader.bin docs/bootloader.bin
          cp .pio/build/esp32-s3-devkitc-1/partitions.bin docs/partitions.bin
          python - <<'PY'
          import json
          p='docs/manifest.json'
          d=json.load(open(p))
          d['version']='v2.11'
          open(p,'w').write(json.dumps(d, indent=2) + '\n')
          PY

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: CynusLink-v2.11-webflasher
          path: |
            docs/CynusLink-firmware.bin
            docs/bootloader.bin
            docs/partitions.bin
            docs/manifest.json

      - name: Publish firmware to Web Flasher
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CynusLink-firmware.bin docs/bootloader.bin docs/partitions.bin docs/manifest.json
          if git diff --cached --quiet; then
            echo 'No firmware changes to commit'
          else
            git commit -m 'Build CynusLink v2.11 firmware [skip ci]'
            git push
          fi
