name: Build CynusLink firmware

on:
  push:
    branches: [ main ]
    paths:
      - 'src/main.cpp'
      - 'src/main_base.inc'
      - 'platformio.ini'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Integrate main_base into main.cpp
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('src/main.cpp')
          base = Path('src/main_base.inc')
          if not base.exists():
              print('main.cpp is already standalone')
              raise SystemExit(0)

          wrapper = main.read_text()
          core = base.read_text()

          marker = '#undef setup\n\n'
          if marker not in wrapper:
              raise SystemExit('Could not find wrapper split marker in src/main.cpp')
          patch = wrapper.split(marker, 1)[1]

          core = core.replace('void setup() {', 'static void cynuslinkCoreSetup() {', 1)
          core = core.replace('void loop() {', 'static void cynuslinkCoreLoop() {', 1)

          merged = core.rstrip() + '\n\n' + patch.lstrip()
          main.write_text(merged)
          base.unlink()
          print('Integrated src/main_base.inc into standalone src/main.cpp')
          PY

          if ! git diff --quiet -- src/main.cpp src/main_base.inc; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A src/main.cpp src/main_base.inc
            git commit -m 'Make main.cpp standalone [skip ci]'
            git push
          fi

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e esp32-s3-devkitc-1

      - name: Prepare Web Flasher files
        run: |
          cp .pio/build/esp32-s3-devkitc-1/firmware.bin docs/CynusLink-firmware.bin
          cp .pio/build/esp32-s3-devkitc-1/bootloader.bin docs/bootloader.bin
          cp .pio/build/esp32-s3-devkitc-1/partitions.bin docs/partitions.bin
          python - <<'PY'
          import json
          p='docs/manifest.json'
          d=json.load(open(p))
          d['version']='v2.11'
          open(p,'w').write(json.dumps(d, indent=2) + '\n')
          PY

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: CynusLink-v2.11-webflasher
          path: |
            docs/CynusLink-firmware.bin
            docs/bootloader.bin
            docs/partitions.bin
            docs/manifest.json

      - name: Publish firmware to Web Flasher
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CynusLink-firmware.bin docs/bootloader.bin docs/partitions.bin docs/manifest.json
          if git diff --cached --quiet; then
            echo 'No firmware changes to commit'
          else
            git commit -m 'Build CynusLink v2.11 firmware [skip ci]'
            git push
          fi
