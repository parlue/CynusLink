name: Build CynusLink firmware

on:
  push:
    branches: [ main ]
    paths:
      - 'src/main.cpp'
      - 'platformio.ini'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply flipped-board startup source update
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/main.cpp')
          s = p.read_text()
          if 'FLIPPED_START_FEN' in s:
              print('Flipped-board startup logic already present')
              raise SystemExit(0)

          def repl(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Patch anchor not found: {label}')
              s = s.replace(old, new, 1)

          repl(
          '''static constexpr const char* START_FEN = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR";
          static constexpr const char* SOUND_OFF_FEN = "rnbq1bnr/pppppppp/8/4k3/8/8/PPPPPPPP/RNBQKBNR";
          static constexpr const char* SOUND_ON_FEN = "rnbq1bnr/pppppppp/4k3/8/8/8/PPPPPPPP/RNBQKBNR";
          ''',
          '''static constexpr const char* START_FEN = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR";
          static constexpr const char* FLIPPED_START_FEN = "RNBKQBNR/PPPPPPPP/8/8/8/8/pppppppp/rnbkqbnr";
          static constexpr const char* SOUND_OFF_FEN = "rnbq1bnr/pppppppp/8/4k3/8/8/PPPPPPPP/RNBQKBNR";
          static constexpr const char* SOUND_ON_FEN = "rnbq1bnr/pppppppp/4k3/8/8/8/PPPPPPPP/RNBQKBNR";
          static bool startPositionLatched = false;
          static bool startPositionFlipped = false;
          static bool startPositionReportPending = false;
          ''', 'start constants')

          repl(
          '''static void recoverCynusLoss(const char* source);
          static void processSupervision();
          ''',
          '''static void recoverCynusLoss(const char* source);
          static void processSupervision();
          static int startPositionOrientation(String placement);
          static void configureStartPosition(bool flipped);
          static bool canReportStartPosition();
          ''', 'helper prototypes')

          repl(
          '''static void setState(GatewayState s) {
              if (state == s) return;
              state = s;
              Serial.printf("[STATE] -> %s\\n", stateName(state));
          }
          ''',
          '''static void setState(GatewayState s) {
              if (state == s) return;
              state = s;
              Serial.printf("[STATE] -> %s\\n", stateName(state));
          }

          static int startPositionOrientation(String placement) {
              int sp = placement.indexOf(' ');
              if (sp >= 0) placement = placement.substring(0, sp);
              if (placement == START_FEN) return 0;
              if (placement == FLIPPED_START_FEN) return 1;
              return -1;
          }

          static bool canReportStartPosition() {
              return !startPositionFlipped || cynusWaitingForMove;
          }

          static void configureStartPosition(bool flipped) {
              startPositionFlipped = flipped;
              startPositionLatched = true;
              startPositionReportPending = true;
              engineSide = flipped ? ENGINE_SIDE_WHITE : ENGINE_SIDE_BLACK;
              setMoveCycle(flipped ? WAIT_ENGINE_MOVE : WAIT_HUMAN_MOVE);

              const char* cmd = flipped ? "set flip board on\\n" : "set flip board off\\n";
              if (sendCynus(cmd)) {
                  Serial.printf("[STARTPOS] flip board %s sent; %s starts\\n",
                      flipped ? "ON" : "OFF", flipped ? "software/white" : "human/white");
              } else {
                  Serial.printf("[STARTPOS] ERROR sending flip board %s\\n", flipped ? "ON" : "OFF");
              }

              if (clConnected && clNotify && canReportStartPosition()) clStatusPending = true;
          }
          ''', 'start helpers')

          repl(
          '''static void sendStatus() {
              if (!boardSynced) {
                  Serial.println("[CHESS] status requested, but board not synced yet");
                  return;
              }
              String p = "s";
              for (int i = 0; i < 64; ++i) p += board64[i];
              Serial.print("[CHESS] TX board A8..H1: ");
              Serial.println(board64);
              sendCL(p);
              lastFenSentToChessLink = fenNow;
          }
          ''',
          '''static void sendStatus() {
              if (!boardSynced) {
                  Serial.println("[CHESS] status requested, but board not synced yet");
                  return;
              }
              if (!clTx || !clConnected || !clNotify) {
                  Serial.println("[CHESS] status deferred: ChessLink notifications not ready");
                  return;
              }
              String p = "s";
              for (int i = 0; i < 64; ++i) p += board64[i];
              Serial.print("[CHESS] TX board A8..H1: ");
              Serial.println(board64);
              sendCL(p);
              lastFenSentToChessLink = fenNow;
              if (startPositionReportPending) {
                  startPositionReportPending = false;
                  Serial.println("[STARTPOS] initial board status delivered to PicoChess");
              }
          }
          ''', 'sendStatus')

          repl(
          '''class TxCB : public NimBLECharacteristicCallbacks {
              void onSubscribe(NimBLECharacteristic*, NimBLEConnInfo&, uint16_t value) override {
                  clNotify = value != 0;
                  Serial.printf("[CHESS] notify %s\\n", clNotify ? "on" : "off");
              }
          };
          ''',
          '''class TxCB : public NimBLECharacteristicCallbacks {
              void onSubscribe(NimBLECharacteristic*, NimBLEConnInfo&, uint16_t value) override {
                  clNotify = value != 0;
                  Serial.printf("[CHESS] notify %s\\n", clNotify ? "on" : "off");
                  if (clNotify && boardSynced && startPositionReportPending && canReportStartPosition()) {
                      clStatusPending = true;
                      Serial.println("[STARTPOS] ChessLink ready; initial board status queued");
                  }
              }
          };
          ''', 'Tx subscribe')

          repl(
          '''                setState(RUNNING);
              if (firstExternalReady) {
          ''',
          '''                setState(RUNNING);
              if (startPositionReportPending && clNotify && canReportStartPosition()) {
                  clStatusPending = true;
                  Serial.println("[STARTPOS] Cynus ready for external move; initial board status queued");
              }
              if (firstExternalReady) {
          ''', 'get move report gate')

          repl(
          '''            if (line.startsWith("fen:")) {
                  String f = line.substring(4);
                  f.trim();

                  if (initialStartupComplete && state == RUNNING && clConnected && moveCycle == WAIT_HUMAN_MOVE && handleSoundConfigFen(f)) {
          ''',
          '''            if (line.startsWith("fen:")) {
                  String f = line.substring(4);
                  f.trim();
                  int startOrientation = startPositionOrientation(f);

                  if (initialStartupComplete && state == RUNNING && clConnected && moveCycle == WAIT_HUMAN_MOVE && handleSoundConfigFen(f)) {
          ''', 'FEN orientation')

          repl(
          '''                    if (state == SYNC_BOARD && cynusReady && boardSyncPurpose != BOARD_SYNC_NONE) {
                          String placement = bufferedFen;
                          int placementSpace = placement.indexOf(' ');
                          if (placementSpace >= 0) placement = placement.substring(0, placementSpace);
                          if (boardSyncPurpose == BOARD_SYNC_STARTUP && placement != START_FEN) {
                              Serial.printf("[STARTUP] board not ready: %s\\n", bufferedFen.c_str());
                              Serial.println("[STARTUP] waiting for initial position; correct board and press Cynus scan");
                              continue;
                          }
                          fenNow = bufferedFen;
                          boardSynced = true;
                          Serial.printf("[BOARD] synchronized physical FEN %s\\n", fenNow.c_str());
                          Serial.printf("[BOARD] ChessLink %s\\n", board64);
                          BoardSyncPurpose completedPurpose = boardSyncPurpose;
                          boardSyncPurpose = BOARD_SYNC_NONE;
                          if (completedPurpose == BOARD_SYNC_STARTUP) {
                              initialStartupComplete = true;
                              engineSide = ENGINE_SIDE_UNKNOWN;
                              Serial.println("[STARTUP] initial position confirmed");
                          } else Serial.println("[RECOVERY] current physical position refreshed");
                          if (!clConnected) {
                              setState(WAIT_CHESSLINK);
                              cynusDisplay("search");
                              startChessLinkAdvertising();
                          } else {
                              setState(RUNNING);
                              setMoveCycle(WAIT_HUMAN_MOVE);
                          }
                          continue;
                      }

                      if (state == RUNNING && clConnected && publishNextFenToChessLink) {
          ''',
          '''                    if (state == SYNC_BOARD && cynusReady && boardSyncPurpose != BOARD_SYNC_NONE) {
                          if (boardSyncPurpose == BOARD_SYNC_STARTUP && startOrientation < 0) {
                              Serial.printf("[STARTUP] board not ready: %s\\n", bufferedFen.c_str());
                              Serial.println("[STARTUP] waiting for normal or flipped initial position; correct board and press Cynus scan");
                              continue;
                          }
                          fenNow = bufferedFen;
                          boardSynced = true;
                          Serial.printf("[BOARD] synchronized physical FEN %s\\n", fenNow.c_str());
                          Serial.printf("[BOARD] ChessLink %s\\n", board64);
                          BoardSyncPurpose completedPurpose = boardSyncPurpose;
                          boardSyncPurpose = BOARD_SYNC_NONE;
                          if (completedPurpose == BOARD_SYNC_STARTUP) {
                              initialStartupComplete = true;
                              configureStartPosition(startOrientation == 1);
                              Serial.printf("[STARTUP] initial position confirmed (%s)\\n", startOrientation == 1 ? "flipped" : "normal");
                          } else {
                              if (startOrientation >= 0 && (!startPositionLatched || startPositionFlipped != (startOrientation == 1))) {
                                  configureStartPosition(startOrientation == 1);
                                  Serial.printf("[NEW GAME] initial position recognized during recovery (%s)\\n", startOrientation == 1 ? "flipped" : "normal");
                              } else if (startOrientation < 0) {
                                  startPositionLatched = false;
                              }
                              Serial.println("[RECOVERY] current physical position refreshed");
                          }
                          if (!clConnected) {
                              setState(WAIT_CHESSLINK);
                              cynusDisplay("search");
                              startChessLinkAdvertising();
                          } else {
                              setState(RUNNING);
                              if (startOrientation >= 0) setMoveCycle(startPositionFlipped ? WAIT_ENGINE_MOVE : WAIT_HUMAN_MOVE);
                              else setMoveCycle(WAIT_HUMAN_MOVE);
                          }
                          continue;
                      }

                      if (state == RUNNING && clConnected && initialStartupComplete && startOrientation >= 0) {
                          bool flipped = startOrientation == 1;
                          bool newStart = !startPositionLatched || startPositionFlipped != flipped;
                          fenNow = bufferedFen;
                          boardSynced = true;
                          publishNextFenToChessLink = false;
                          correctionFenCandidate = "";
                          if (newStart) {
                              lastFenSentToChessLink = "";
                              configureStartPosition(flipped);
                              Serial.printf("[NEW GAME] initial position recognized (%s)\\n", flipped ? "flipped" : "normal");
                          } else {
                              setMoveCycle(startPositionFlipped ? WAIT_ENGINE_MOVE : WAIT_HUMAN_MOVE);
                          }
                          if (startPositionReportPending && clNotify && canReportStartPosition()) clStatusPending = true;
                          continue;
                      }

                      if (state == RUNNING && clConnected && publishNextFenToChessLink) {
          ''', 'startup and new game flow')

          repl(
          '''                    if (state == RUNNING && clConnected && publishNextFenToChessLink) {
                          String previousAcceptedFen = fenNow;
                          fenNow = bufferedFen;
                          boardSynced = true;
                          publishNextFenToChessLink = false;
          ''',
          '''                    if (state == RUNNING && clConnected && publishNextFenToChessLink) {
                          String previousAcceptedFen = fenNow;
                          fenNow = bufferedFen;
                          boardSynced = true;
                          startPositionLatched = false;
                          publishNextFenToChessLink = false;
          ''', 'human move unlatch')

          repl(
          '''                    if (state == RUNNING && moveCycle == WAIT_ROBOT_POSITION) {
                          fenNow = bufferedFen;
                          boardSynced = true;
          ''',
          '''                    if (state == RUNNING && moveCycle == WAIT_ROBOT_POSITION) {
                          fenNow = bufferedFen;
                          boardSynced = true;
                          startPositionLatched = false;
          ''', 'robot move unlatch')

          repl(
          '''        if (cynusReady && boardSynced && state == WAIT_CHESSLINK) {
              chessAdvertisingAllowed = false;
              setState(RUNNING);
              setMoveCycle(WAIT_HUMAN_MOVE);
              Serial.println("[CHESS] connected to synchronized board; gateway RUNNING");
          ''',
          '''        if (cynusReady && boardSynced && state == WAIT_CHESSLINK) {
              chessAdvertisingAllowed = false;
              setState(RUNNING);
              setMoveCycle(startPositionLatched && startPositionFlipped ? WAIT_ENGINE_MOVE : WAIT_HUMAN_MOVE);
              Serial.printf("[CHESS] connected to synchronized board; gateway RUNNING, opening=%s\\n",
                  startPositionLatched && startPositionFlipped ? "SOFTWARE" : "HUMAN");
              if (startPositionReportPending && clNotify && canReportStartPosition()) clStatusPending = true;
          ''', 'ChessLink connect opening state')

          repl(
          '''    displayPlayPending = false;
              engineSide = ENGINE_SIDE_UNKNOWN;
              boardSyncPurpose = BOARD_SYNC_NONE;
          ''',
          '''    displayPlayPending = false;
              engineSide = ENGINE_SIDE_UNKNOWN;
              startPositionLatched = false;
              startPositionReportPending = false;
              boardSyncPurpose = BOARD_SYNC_NONE;
          ''', 'Cynus recovery reset')

          p.write_text(s)
          print('Applied flipped-board startup logic to src/main.cpp')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- src/main.cpp; then
            git add src/main.cpp
            git commit -m 'Handle normal and flipped start positions [skip ci]'
            git push
          fi

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e esp32-s3-devkitc-1

      - name: Prepare Web Flasher files
        run: |
          cp .pio/build/esp32-s3-devkitc-1/firmware.bin docs/CynusLink-firmware.bin
          cp .pio/build/esp32-s3-devkitc-1/bootloader.bin docs/bootloader.bin
          cp .pio/build/esp32-s3-devkitc-1/partitions.bin docs/partitions.bin
          python - <<'PY'
          import json
          p='docs/manifest.json'
          d=json.load(open(p))
          d['version']='v2.11'
          open(p,'w').write(json.dumps(d, indent=2) + '\n')
          PY

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: CynusLink-v2.11-webflasher
          path: |
            docs/CynusLink-firmware.bin
            docs/bootloader.bin
            docs/partitions.bin
            docs/manifest.json

      - name: Publish firmware to Web Flasher
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CynusLink-firmware.bin docs/bootloader.bin docs/partitions.bin docs/manifest.json
          if git diff --cached --quiet; then
            echo 'No firmware changes to commit'
          else
            git commit -m 'Build CynusLink v2.11 firmware [skip ci]'
            git push
          fi
