name: Sync CynusLink source patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore visible board scan status
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/main.cpp')
          s = p.read_text()
          old = '''    if (boardSyncRequestPending && cynusReady && (int32_t)(millis() - boardSyncRequestAt) >= 0) {
        boardSyncRequestPending = false;
        Serial.println("[SYNC] starting physical board scan");
        if (sendCynus("scan board\\n")) {'''
          new = '''    if (boardSyncRequestPending && cynusReady && (int32_t)(millis() - boardSyncRequestAt) >= 0) {
        boardSyncRequestPending = false;
        displayPlayPending = false;
        cynusDisplay("B Scan");
        Serial.println("[DISPLAY] B Scan: scanning physical board before ChessLink");
        Serial.println("[SYNC] starting physical board scan");
        if (sendCynus("scan board\\n")) {'''

          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
              print('patched: visible B Scan status')
          elif new in s:
              print('already patched')
          else:
              raise SystemExit('Patch anchor not found for board scan status')
          PY

          if ! git diff --quiet -- src/main.cpp; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/main.cpp
            git commit -m 'Restore board scan display [skip ci]'
            git push
          fi
