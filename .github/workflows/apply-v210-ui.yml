name: Apply v2.10 display UI
# trigger
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-v210-ui.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main.ccp')
          s = p.read_text(encoding='utf-8')

          anchor = 'static String bufferedFen = "";\n'
          ui_globals = '''static String bufferedFen = "";\n\nstatic bool displayPlayPending = false;\nstatic uint32_t displayPlayAt = 0;\n'''
          if 'displayPlayPending' not in s:
              s = s.replace(anchor, ui_globals, 1)

          anchor = 'static bool sendCynus(const char* s);\n'
          decls = '''static bool sendCynus(const char* s);\nstatic void cynusDisplay(const char* text);\nstatic void schedulePlayDisplay(uint32_t delayMs = 1800);\nstatic String moveDisplayText(const String& uci);\nstatic String inferMoveDisplayText(const String& oldFen, const String& newFen);\n'''
          if 'static void cynusDisplay' not in s:
              s = s.replace(anchor, decls, 1)

          marker = 'static bool connectCynus() {'
          helpers = r'''
static void cynusDisplay(const char* text) {
    if (!cynusReady || !cynusChr || !text) return;
    String msg = text;
    if (msg.length() > 7) msg = msg.substring(0, 7);
    String cmd = "display txt ";
    cmd += msg;
    cmd += "\n";
    if (sendCynus(cmd.c_str())) Serial.printf("[DISPLAY] %s\n", msg.c_str());
    else Serial.printf("[DISPLAY] failed: %s\n", msg.c_str());
}

static void schedulePlayDisplay(uint32_t delayMs) {
    displayPlayPending = true;
    displayPlayAt = millis() + delayMs;
}

static String moveDisplayText(const String& uci) {
    if (uci == "e1g1" || uci == "e8g8") return "0-0";
    if (uci == "e1c1" || uci == "e8c8") return "0-0-0";
    if (uci.length() >= 5) {
        char promo = (char)toupper((unsigned char)uci[4]);
        if (promo == 'Q' || promo == 'R' || promo == 'B' || promo == 'N') {
            String t = "Chg "; t += promo; return t;
        }
    }
    if (uci.length() >= 4) {
        String t;
        t += (char)toupper((unsigned char)uci[0]); t += uci[1]; t += '-';
        t += (char)toupper((unsigned char)uci[2]); t += uci[3];
        return t;
    }
    return "";
}

static bool fenPlacementTo64(String f, char out[65]) {
    int sp = f.indexOf(' '); if (sp >= 0) f = f.substring(0, sp);
    int n = 0;
    for (size_t i = 0; i < f.length(); ++i) {
        char c = f[i];
        if (c == '/') continue;
        if (c >= '1' && c <= '8') {
            for (int k = 0; k < c - '0'; ++k) { if (n >= 64) return false; out[n++] = '.'; }
        } else if (strchr("KQRBNPkqrbnp", c)) {
            if (n >= 64) return false; out[n++] = c;
        } else return false;
    }
    if (n != 64) return false; out[64] = 0; return true;
}

static String inferMoveDisplayText(const String& oldFen, const String& newFen) {
    if (!oldFen.length() || !newFen.length()) return "";
    char oldB[65], newB[65];
    if (!fenPlacementTo64(oldFen, oldB) || !fenPlacementTo64(newFen, newB)) return "";
    const struct { int from; int to; const char* uci; } castles[] = {
        {60,62,"e1g1"},{60,58,"e1c1"},{4,6,"e8g8"},{4,2,"e8c8"}
    };
    for (const auto& c : castles) {
        char king = c.from == 60 ? 'K' : 'k';
        if (oldB[c.from] == king && newB[c.from] == '.' && newB[c.to] == king) return moveDisplayText(c.uci);
    }
    int source = -1, destination = -1;
    for (int i = 0; i < 64; ++i) {
        if (oldB[i] != newB[i] && oldB[i] != '.' && newB[i] == '.') { source = i; break; }
    }
    if (source < 0) return "";
    char mover = oldB[source]; bool white = mover >= 'A' && mover <= 'Z';
    for (int i = 0; i < 64; ++i) {
        if (oldB[i] == newB[i] || newB[i] == '.') continue;
        char np = newB[i];
        bool sameSide = white ? (np >= 'A' && np <= 'Z') : (np >= 'a' && np <= 'z');
        if (sameSide && i != source) { destination = i; break; }
    }
    if (destination < 0) return "";
    String uci = squareName(source % 8, source / 8) + squareName(destination % 8, destination / 8);
    if ((mover == 'P' || mover == 'p') && newB[destination] != mover) uci += (char)tolower((unsigned char)newB[destination]);
    return moveDisplayText(uci);
}

'''
          if 'static void cynusDisplay(const char* text) {' not in s:
              s = s.replace(marker, helpers + marker, 1)

          old = '                Serial.printf("[GATEWAY] decoded move %s\\n", uci.c_str());\n'
          new = '''                Serial.printf("[GATEWAY] decoded move %s\\n", uci.c_str());\n                String displayMove = moveDisplayText(uci);\n                if (displayMove.length()) { displayPlayPending = false; cynusDisplay(displayMove.c_str()); }\n'''
          if old in s and 'String displayMove = moveDisplayText(uci);' not in s: s = s.replace(old, new, 1)

          old = '''                    if (state == RUNNING && clConnected && publishNextFenToChessLink) {\n                        fenNow = bufferedFen;\n                        boardSynced = true;'''
          new = '''                    if (state == RUNNING && clConnected && publishNextFenToChessLink) {\n                        String previousAcceptedFen = fenNow;\n                        fenNow = bufferedFen;\n                        boardSynced = true;'''
          if old in s and 'String previousAcceptedFen = fenNow;' not in s: s = s.replace(old, new, 1)

          old = '                        Serial.printf("[BOARD] ChessLink %s\\n", board64);\n                        if (autoReport()) clStatusPending = true;\n'
          new = '''                        Serial.printf("[BOARD] ChessLink %s\\n", board64);\n                        String humanDisplayMove = inferMoveDisplayText(previousAcceptedFen, fenNow);\n                        if (humanDisplayMove.length()) { displayPlayPending = false; cynusDisplay(humanDisplayMove.c_str()); schedulePlayDisplay(1400); }\n                        if (autoReport()) clStatusPending = true;\n'''
          if old in s and 'humanDisplayMove' not in s: s = s.replace(old, new, 1)

          old = '    Serial.printf("[CYNUS] connected %s\\n", cynusDev->getName().c_str());\n'
          new = '''    Serial.printf("[CYNUS] connected %s\\n", cynusDev->getName().c_str());\n    cynusDisplay("search");\n'''
          if old in s: s = s.replace(old, new, 1)

          old = '            Serial.println("[CHESS] connected to synchronized board; gateway RUNNING");\n'
          new = '''            Serial.println("[CHESS] connected to synchronized board; gateway RUNNING");\n            cynusDisplay("ready");\n            schedulePlayDisplay(1800);\n'''
          if old in s: s = s.replace(old, new, 1)

          old = '    Serial.printf("[RECOVERY] ChessLink loss detected by %s\\n", source);\n'
          new = '''    Serial.printf("[RECOVERY] ChessLink loss detected by %s\\n", source);\n    if (cynusReady) { displayPlayPending = false; cynusDisplay("search"); }\n'''
          if old in s: s = s.replace(old, new, 1)

          old = '                    Serial.println("[MOVE] robot move complete; refreshing internal board only");\n                    sendCynus("get fen\\n");\n'
          new = '''                    Serial.println("[MOVE] robot move complete; refreshing internal board only");\n                    displayPlayPending = false;\n                    cynusDisplay("play");\n                    sendCynus("get fen\\n");\n'''
          if old in s: s = s.replace(old, new, 1)

          old = '    processSupervision();\n'
          new = '''    processSupervision();\n    if (displayPlayPending && cynusReady && clConnected && (int32_t)(millis() - displayPlayAt) >= 0) { displayPlayPending = false; cynusDisplay("play"); }\n'''
          if old in s and 'millis() - displayPlayAt' not in s: s = s.replace(old, new, 1)

          old = '    correctionFenCandidate = "";\n    engineSide = ENGINE_SIDE_UNKNOWN;\n'
          new = '''    correctionFenCandidate = "";\n    displayPlayPending = false;\n    engineSide = ENGINE_SIDE_UNKNOWN;\n'''
          if old in s: s = s.replace(old, new, 1)

          s = s.replace('=== CynusLink Robust Core Baseline v2.9 ===', '=== CynusLink Robust Core Baseline v2.10 ===', 1)
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/apply-v210-ui.yml').unlink()
          PY
      - name: Commit UI
        run: |
          git config user.name "CynusLink Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/main.ccp .github/workflows/apply-v210-ui.yml
          git commit -m "Restore Cynus display status and move messages"
          git push
