name: Apply scan board startup patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-scan-board-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch src/main.ccp
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/main.ccp')
          text = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'Patch anchor not found: {label}')
              text = text.replace(old, new, 1)

          replace_once(
              '''static uint32_t nextCynusScanAt = 0;\nstatic uint32_t boardSyncRequestAt = 0;\nstatic bool boardSyncRequestPending = false;\n''',
              '''static uint32_t nextCynusScanAt = 0;\nstatic uint32_t boardSyncRequestAt = 0;\nstatic bool boardSyncRequestPending = false;\n\n// Startup/recovery uses an active physical scan before reading FEN.\nstatic bool boardScanPending = false;\nstatic uint32_t boardScanGetFenAt = 0;\nstatic constexpr uint32_t BOARD_SCAN_WAIT_MS = 1000;\n''',
              'scan state'
          )

          replace_once(
              '''    boardSyncPurpose = BOARD_SYNC_NONE;\n    boardSyncRequestPending = false;\n    boardSynced = false;\n''',
              '''    boardSyncPurpose = BOARD_SYNC_NONE;\n    boardSyncRequestPending = false;\n    boardScanPending = false;\n    boardSynced = false;\n''',
              'connect reset'
          )

          replace_once(
              '''    bufferedFen = \"\";\n    boardSyncPurpose = BOARD_SYNC_NONE;\n    boardSyncRequestPending = false;\n\n    cynusWaitingForMove = false;\n''',
              '''    bufferedFen = \"\";\n    boardSyncPurpose = BOARD_SYNC_NONE;\n    boardSyncRequestPending = false;\n    boardScanPending = false;\n\n    cynusWaitingForMove = false;\n''',
              'recovery reset'
          )

          replace_once(
              '''    if (\n        boardSyncRequestPending &&\n        cynusReady &&\n        (int32_t)(millis() - boardSyncRequestAt) >= 0\n    ) {\n        boardSyncRequestPending = false;\n        Serial.println(\"[SYNC] actively requesting physical FEN\");\n        sendCynus(\"get fen\\n\");\n    }\n''',
              '''    if (\n        boardSyncRequestPending &&\n        cynusReady &&\n        (int32_t)(millis() - boardSyncRequestAt) >= 0\n    ) {\n        boardSyncRequestPending = false;\n\n        Serial.println(\"[SYNC] starting physical board scan\");\n\n        if (sendCynus(\"scan board\\n\")) {\n            boardScanPending = true;\n            boardScanGetFenAt =\n                millis() + BOARD_SCAN_WAIT_MS;\n        } else {\n            Serial.println(\n                \"[SYNC] ERROR: could not start board scan\"\n            );\n\n            boardSyncRequestPending = true;\n            boardSyncRequestAt = millis() + 500;\n        }\n    }\n\n    if (\n        boardScanPending &&\n        cynusReady &&\n        (int32_t)(millis() - boardScanGetFenAt) >= 0\n    ) {\n        boardScanPending = false;\n\n        Serial.println(\n            \"[SYNC] board scan complete; requesting fresh FEN\"\n        );\n\n        if (!sendCynus(\"get fen\\n\")) {\n            Serial.println(\n                \"[SYNC] ERROR: could not request FEN after scan\"\n            );\n\n            boardSyncRequestPending = true;\n            boardSyncRequestAt = millis() + 500;\n        }\n    }\n''',
              'scan then get fen sequence'
          )

          if '=== CynusLink Robust Core Baseline v2.2 ===' not in text:
              raise SystemExit('Expected v2.2 banner not found')
          text = text.replace(
              '=== CynusLink Robust Core Baseline v2.2 ===',
              '=== CynusLink Robust Core Baseline v2.3 ===',
              1
          )

          p.write_text(text, encoding='utf-8')
          Path('.github/workflows/apply-scan-board-patch.yml').unlink()
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "CynusLink Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/main.ccp .github/workflows/apply-scan-board-patch.yml
          git commit -m "Use active board scan before startup FEN"
          git push
