name: Apply double-step LED decode fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-double-step-led-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch extractMoveFromLCommand
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/main.ccp')
          text = p.read_text(encoding='utf-8')

          start = text.index('static bool extractMoveFromLCommand(String& uci) {')
          end = text.index('// ============================================================\n// ChessLink protocol', start)

          new_func = r'''static bool extractMoveFromLCommand(String& uci) {
    HighlightedSquare squares[64];
    int n = 0;

    for (int rankTop = 0; rankTop < 8; ++rankTop) {
        for (int file = 0; file < 8; ++file) {
            squares[n++] = {
                file,
                rankTop,
                squareHighlightScore(file, rankTop),
                dominantSquarePattern(file, rankTop)
            };
        }
    }

    int hitIndex[64];
    int hitCount = 0;

    for (int i = 0; i < 64; ++i) {
        // A normally highlighted square has all four corner LEDs active.
        // Accept 3 as tolerance for applications with a shared/missing corner.
        if (squares[i].score >= 3) {
            hitIndex[hitCount++] = i;
        }
    }

    Serial.printf(
        "[GATEWAY] L highlights %d squares:",
        hitCount
    );

    for (int i = 0; i < hitCount; ++i) {
        const auto& s = squares[hitIndex[i]];

        Serial.printf(
            " %s(score=%d,pat=%02X)",
            squareName(s.file, s.rankTop).c_str(),
            s.score,
            s.dominantPattern
        );
    }

    Serial.println();

    int endpointA = -1;
    int endpointB = -1;

    if (hitCount == 2) {
        endpointA = hitIndex[0];
        endpointB = hitIndex[1];
    } else if (hitCount == 3) {
        // ChessLink uses a 9x9 corner-LED grid. For a two-square orthogonal
        // move, e.g. d7-d5, the endpoints d7/d5 light four corners each.
        // Their shared corner geometry can make the intermediate square d6
        // look fully highlighted as well. Accept only the strict pattern of
        // three consecutive collinear squares and use the two outer squares.
        const auto& s0 = squares[hitIndex[0]];
        const auto& s1 = squares[hitIndex[1]];
        const auto& s2 = squares[hitIndex[2]];

        const bool sameFile =
            s0.file == s1.file &&
            s1.file == s2.file;

        const bool sameRank =
            s0.rankTop == s1.rankTop &&
            s1.rankTop == s2.rankTop;

        bool consecutive = false;

        if (sameFile) {
            int r0 = s0.rankTop;
            int r1 = s1.rankTop;
            int r2 = s2.rankTop;

            consecutive =
                (r1 == r0 + 1 && r2 == r1 + 1) ||
                (r1 == r0 - 1 && r2 == r1 - 1);
        } else if (sameRank) {
            int f0 = s0.file;
            int f1 = s1.file;
            int f2 = s2.file;

            consecutive =
                (f1 == f0 + 1 && f2 == f1 + 1) ||
                (f1 == f0 - 1 && f2 == f1 - 1);
        }

        if (!consecutive) {
            Serial.println(
                "[GATEWAY] L ignored: 3-square pattern is not consecutive and collinear"
            );
            return false;
        }

        endpointA = hitIndex[0];
        endpointB = hitIndex[2];

        const auto& mid = squares[hitIndex[1]];
        const int midIdx = mid.rankTop * 8 + mid.file;

        if (board64[midIdx] != '.') {
            Serial.println(
                "[GATEWAY] L ignored: middle square of 3-square pattern is occupied"
            );
            return false;
        }

        Serial.printf(
            "[GATEWAY] 3-square LED bridge detected; using endpoints %s and %s\n",
            squareName(squares[endpointA].file, squares[endpointA].rankTop).c_str(),
            squareName(squares[endpointB].file, squares[endpointB].rankTop).c_str()
        );
    } else {
        Serial.println(
            "[GATEWAY] L ignored: unsupported highlighted-square count"
        );
        return false;
    }

    const auto& a = squares[endpointA];
    const auto& b = squares[endpointB];

    const String sqA = squareName(a.file, a.rankTop);
    const String sqB = squareName(b.file, b.rankTop);

    const int idxA = a.rankTop * 8 + a.file;
    const int idxB = b.rankTop * 8 + b.file;

    const bool occA = board64[idxA] != '.';
    const bool occB = board64[idxB] != '.';

    Serial.printf(
        "[GATEWAY] move candidates %s occ=%d pat=%02X, %s occ=%d pat=%02X\n",
        sqA.c_str(),
        occA,
        a.dominantPattern,
        sqB.c_str(),
        occB,
        b.dominantPattern
    );

    // Normal non-capture: source is the occupied endpoint.
    if (occA && !occB) {
        uci = sqA + sqB;
        return true;
    }

    if (occB && !occA) {
        uci = sqB + sqA;
        return true;
    }

    // Capture: both may be occupied. In observed ChessLink/PicoChess
    // delta frames 0x33 and 0xCC distinguish source and destination.
    // Keep this explicit and conservative; never guess unknown patterns.
    if (
        occA && occB &&
        a.dominantPattern == 0x33 &&
        b.dominantPattern == 0xCC
    ) {
        uci = sqA + sqB;
        return true;
    }

    if (
        occA && occB &&
        a.dominantPattern == 0xCC &&
        b.dominantPattern == 0x33
    ) {
        uci = sqB + sqA;
        return true;
    }

    Serial.println(
        "[GATEWAY] L ignored: source/destination is ambiguous"
    );

    return false;
}

'''

          text = text[:start] + new_func + text[end:]

          if '=== CynusLink Robust Core Baseline v2.6 ===' in text:
              text = text.replace(
                  '=== CynusLink Robust Core Baseline v2.6 ===',
                  '=== CynusLink Robust Core Baseline v2.7 ===',
                  1
              )
          elif '=== CynusLink Robust Core Baseline v2.5 ===' in text:
              text = text.replace(
                  '=== CynusLink Robust Core Baseline v2.5 ===',
                  '=== CynusLink Robust Core Baseline v2.7 ===',
                  1
              )

          p.write_text(text, encoding='utf-8')
          Path('.github/workflows/apply-double-step-led-fix.yml').unlink()
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "CynusLink Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/main.ccp .github/workflows/apply-double-step-led-fix.yml
          git commit -m "Decode two-square moves from bridged LED patterns"
          git push
