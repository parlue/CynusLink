# trigger existing workflow
name: Apply double-step LED decode fix
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-double-step-led-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch decoder
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main.ccp')
          s=p.read_text()
          a=s.index('static bool extractMoveFromLCommand(String& uci) {')
          b=s.index('// ============================================================\n// ChessLink protocol',a)
          f=r'''static bool extractMoveFromLCommand(String& uci) {
    HighlightedSquare squares[64];
    int n = 0;

    for (int rankTop = 0; rankTop < 8; ++rankTop) {
        for (int file = 0; file < 8; ++file) {
            squares[n++] = {
                file,
                rankTop,
                squareHighlightScore(file, rankTop),
                dominantSquarePattern(file, rankTop)
            };
        }
    }

    int hitIndex[64];
    int hitCount = 0;

    for (int i = 0; i < 64; ++i) {
        if (squares[i].score >= 3) {
            hitIndex[hitCount++] = i;
        }
    }

    Serial.printf("[GATEWAY] L highlights %d squares:", hitCount);
    for (int i = 0; i < hitCount; ++i) {
        const auto& s = squares[hitIndex[i]];
        Serial.printf(" %s(score=%d,pat=%02X)",
            squareName(s.file, s.rankTop).c_str(),
            s.score,
            s.dominantPattern);
    }
    Serial.println();

    int endpointA = -1;
    int endpointB = -1;

    if (hitCount == 2) {
        endpointA = hitIndex[0];
        endpointB = hitIndex[1];
    } else if (hitCount == 3) {
        const auto& s0 = squares[hitIndex[0]];
        const auto& s1 = squares[hitIndex[1]];
        const auto& s2 = squares[hitIndex[2]];

        const bool sameFile =
            s0.file == s1.file && s1.file == s2.file;
        const bool sameRank =
            s0.rankTop == s1.rankTop && s1.rankTop == s2.rankTop;

        bool consecutive = false;
        if (sameFile) {
            consecutive =
                s1.rankTop == s0.rankTop + 1 &&
                s2.rankTop == s1.rankTop + 1;
        } else if (sameRank) {
            consecutive =
                s1.file == s0.file + 1 &&
                s2.file == s1.file + 1;
        }

        if (!consecutive) {
            Serial.println("[GATEWAY] L ignored: 3-square pattern not consecutive/collinear");
            return false;
        }

        const int midIdx = s1.rankTop * 8 + s1.file;
        if (board64[midIdx] != '.') {
            Serial.println("[GATEWAY] L ignored: middle bridge square occupied");
            return false;
        }

        endpointA = hitIndex[0];
        endpointB = hitIndex[2];
        Serial.printf("[GATEWAY] 3-square LED bridge detected; endpoints %s %s\n",
            squareName(squares[endpointA].file, squares[endpointA].rankTop).c_str(),
            squareName(squares[endpointB].file, squares[endpointB].rankTop).c_str());
    } else {
        Serial.println("[GATEWAY] L ignored: unsupported highlighted-square count");
        return false;
    }

    const auto& a = squares[endpointA];
    const auto& b = squares[endpointB];
    const String sqA = squareName(a.file, a.rankTop);
    const String sqB = squareName(b.file, b.rankTop);
    const int idxA = a.rankTop * 8 + a.file;
    const int idxB = b.rankTop * 8 + b.file;
    const bool occA = board64[idxA] != '.';
    const bool occB = board64[idxB] != '.';

    Serial.printf("[GATEWAY] move candidates %s occ=%d pat=%02X, %s occ=%d pat=%02X\n",
        sqA.c_str(), occA, a.dominantPattern,
        sqB.c_str(), occB, b.dominantPattern);

    if (occA && !occB) {
        uci = sqA + sqB;
        return true;
    }
    if (occB && !occA) {
        uci = sqB + sqA;
        return true;
    }
    if (occA && occB && a.dominantPattern == 0x33 && b.dominantPattern == 0xCC) {
        uci = sqA + sqB;
        return true;
    }
    if (occA && occB && a.dominantPattern == 0xCC && b.dominantPattern == 0x33) {
        uci = sqB + sqA;
        return true;
    }

    Serial.println("[GATEWAY] L ignored: source/destination is ambiguous");
    return false;
}

'''
          s=s[:a]+f+s[b:]
          s=s.replace('=== CynusLink Robust Core Baseline v2.6 ===','=== CynusLink Robust Core Baseline v2.7 ===',1)
          s=s.replace('=== CynusLink Robust Core Baseline v2.5 ===','=== CynusLink Robust Core Baseline v2.7 ===',1)
          p.write_text(s)
          Path('.github/workflows/apply-double-step-led-fix.yml').unlink()
          PY
      - name: Commit
        run: |
          git config user.name "CynusLink Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/main.ccp .github/workflows/apply-double-step-led-fix.yml
          git commit -m "Decode bridged LED pattern for two-square moves"
          git push
