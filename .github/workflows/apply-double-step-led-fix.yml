name: Apply generic ChessLink LED decoder
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-double-step-led-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace LED move decoder only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main.ccp')
          s = p.read_text(encoding='utf-8')
          start = s.index('static bool extractMoveFromLCommand(String& uci) {')
          end = s.index('// ============================================================\n// ChessLink protocol', start)
          new = r'''static bool extractMoveFromLCommand(String& uci) {
    // Decode the original 9x9 ChessLink corner-LED pattern directly.
    // This avoids phantom chess squares for long moves and knight moves.
    bool observed[81];
    int observedCount = 0;

    for (int i = 0; i < 81; ++i) {
        observed[i] = led[i] != 0;
        if (observed[i]) ++observedCount;
    }

    Serial.printf("[GATEWAY] raw active corner LEDs=%d\n", observedCount);

    if (observedCount < 6 || observedCount > 8) {
        Serial.println("[GATEWAY] L ignored: raw LED pattern is not a two-square move");
        return false;
    }

    auto addSquareCorners = [](bool mask[81], int file, int rankTop) {
        mask[file * 9 + rankTop] = true;
        mask[(file + 1) * 9 + rankTop] = true;
        mask[file * 9 + rankTop + 1] = true;
        mask[(file + 1) * 9 + rankTop + 1] = true;
    };

    struct EndpointPair { int a; int b; };
    EndpointPair endpointPairs[16];
    int endpointPairCount = 0;

    for (int a = 0; a < 64; ++a) {
        int fileA = a % 8;
        int rankA = a / 8;

        for (int b = a + 1; b < 64; ++b) {
            int fileB = b % 8;
            int rankB = b / 8;
            bool expected[81] = {false};

            addSquareCorners(expected, fileA, rankA);
            addSquareCorners(expected, fileB, rankB);

            bool identical = true;
            for (int i = 0; i < 81; ++i) {
                if (expected[i] != observed[i]) {
                    identical = false;
                    break;
                }
            }

            if (identical && endpointPairCount < 16) {
                endpointPairs[endpointPairCount++] = {a, b};
            }
        }
    }

    Serial.printf("[GATEWAY] raw LED endpoint pairs=%d\n", endpointPairCount);

    if (endpointPairCount == 0) {
        Serial.println("[GATEWAY] L ignored: no exact two-square LED pattern");
        return false;
    }

    auto isWhitePiece = [](char p) { return p >= 'A' && p <= 'Z'; };
    auto isBlackPiece = [](char p) { return p >= 'a' && p <= 'z'; };
    auto sameColor = [&](char a, char b) {
        if (a == '.' || b == '.') return false;
        return (isWhitePiece(a) && isWhitePiece(b)) ||
               (isBlackPiece(a) && isBlackPiece(b));
    };
    auto signInt = [](int v) { return v < 0 ? -1 : (v > 0 ? 1 : 0); };

    auto pathClear = [&](int sf, int sr, int df, int dr) {
        int stepF = signInt(df - sf);
        int stepR = signInt(dr - sr);
        int f = sf + stepF;
        int r = sr + stepR;

        while (f != df || r != dr) {
            if (f < 0 || f > 7 || r < 0 || r > 7) return false;
            if (board64[r * 8 + f] != '.') return false;
            f += stepF;
            r += stepR;
        }
        return true;
    };

    auto legalGeometry = [&](int source, int destination) {
        char piece = board64[source];
        char target = board64[destination];
        if (piece == '.' || sameColor(piece, target)) return false;

        int sf = source % 8;
        int sr = source / 8;
        int df = destination % 8;
        int dr = destination / 8;
        int deltaF = df - sf;
        int deltaR = dr - sr;
        int adf = deltaF < 0 ? -deltaF : deltaF;
        int adr = deltaR < 0 ? -deltaR : deltaR;

        switch (piece) {
            case 'P': {
                int dir = -1;
                if (deltaF == 0 && deltaR == dir && target == '.') return true;
                if (deltaF == 0 && sr == 6 && deltaR == 2 * dir && target == '.') {
                    return board64[(sr + dir) * 8 + sf] == '.';
                }
                if (adf == 1 && deltaR == dir && target != '.' && isBlackPiece(target)) return true;
                if (adf == 1 && deltaR == dir && target == '.') {
                    return board64[sr * 8 + df] == 'p';
                }
                return false;
            }
            case 'p': {
                int dir = 1;
                if (deltaF == 0 && deltaR == dir && target == '.') return true;
                if (deltaF == 0 && sr == 1 && deltaR == 2 * dir && target == '.') {
                    return board64[(sr + dir) * 8 + sf] == '.';
                }
                if (adf == 1 && deltaR == dir && target != '.' && isWhitePiece(target)) return true;
                if (adf == 1 && deltaR == dir && target == '.') {
                    return board64[sr * 8 + df] == 'P';
                }
                return false;
            }
            case 'N': case 'n':
                return (adf == 1 && adr == 2) || (adf == 2 && adr == 1);
            case 'B': case 'b':
                return adf == adr && adf > 0 && pathClear(sf, sr, df, dr);
            case 'R': case 'r':
                return ((deltaF == 0) != (deltaR == 0)) && pathClear(sf, sr, df, dr);
            case 'Q': case 'q': {
                bool diagonal = adf == adr && adf > 0;
                bool straight = ((deltaF == 0) != (deltaR == 0));
                return (diagonal || straight) && pathClear(sf, sr, df, dr);
            }
            case 'K': case 'k': {
                if (adf <= 1 && adr <= 1 && (adf + adr) > 0) return true;
                if (deltaR == 0 && sf == 4 && adf == 2) {
                    bool correctRank = (piece == 'K' && sr == 7) || (piece == 'k' && sr == 0);
                    if (!correctRank || !pathClear(sf, sr, df, dr)) return false;
                    int rookFile = deltaF > 0 ? 7 : 0;
                    char rook = piece == 'K' ? 'R' : 'r';
                    return board64[sr * 8 + rookFile] == rook;
                }
                return false;
            }
        }
        return false;
    };

    struct MoveCandidate { int source; int destination; };
    MoveCandidate candidates[16];
    int candidateCount = 0;

    auto addCandidate = [&](int source, int destination) {
        if (!legalGeometry(source, destination)) return;
        for (int i = 0; i < candidateCount; ++i) {
            if (candidates[i].source == source && candidates[i].destination == destination) return;
        }
        if (candidateCount < 16) candidates[candidateCount++] = {source, destination};
    };

    for (int i = 0; i < endpointPairCount; ++i) {
        addCandidate(endpointPairs[i].a, endpointPairs[i].b);
        addCandidate(endpointPairs[i].b, endpointPairs[i].a);
    }

    Serial.printf("[GATEWAY] legal LED move candidates=%d\n", candidateCount);

    for (int i = 0; i < candidateCount; ++i) {
        Serial.printf("[GATEWAY] legal candidate %s%s piece=%c\n",
            squareName(candidates[i].source % 8, candidates[i].source / 8).c_str(),
            squareName(candidates[i].destination % 8, candidates[i].destination / 8).c_str(),
            board64[candidates[i].source]);
    }

    if (candidateCount > 1) {
        int patternWinner = -1;
        for (int i = 0; i < candidateCount; ++i) {
            int source = candidates[i].source;
            int destination = candidates[i].destination;
            uint8_t sp = dominantSquarePattern(source % 8, source / 8);
            uint8_t dp = dominantSquarePattern(destination % 8, destination / 8);
            if (sp == 0x33 && dp == 0xCC) {
                if (patternWinner != -1) {
                    patternWinner = -2;
                    break;
                }
                patternWinner = i;
            }
        }
        if (patternWinner >= 0) {
            candidates[0] = candidates[patternWinner];
            candidateCount = 1;
            Serial.println("[GATEWAY] capture direction resolved by 33/CC LED pattern");
        }
    }

    if (candidateCount != 1) {
        Serial.println("[GATEWAY] L ignored: move remains ambiguous");
        return false;
    }

    int source = candidates[0].source;
    int destination = candidates[0].destination;
    uci = squareName(source % 8, source / 8) +
          squareName(destination % 8, destination / 8);

    Serial.printf("[GATEWAY] raw LED move resolved %s piece=%c\n",
        uci.c_str(), board64[source]);
    return true;
}

'''
          s = s[:start] + new + s[end:]
          for old in [
              '=== CynusLink Robust Core Baseline v2.6 ===',
              '=== CynusLink Robust Core Baseline v2.7 ==='
          ]:
              s = s.replace(old, '=== CynusLink Robust Core Baseline v2.8 ===', 1)
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/apply-double-step-led-fix.yml').unlink()
          PY
      - name: Commit decoder
        shell: bash
        run: |
          git config user.name "CynusLink Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/main.ccp .github/workflows/apply-double-step-led-fix.yml
          git commit -m "Use generic ChessLink corner LED move decoder"
          git push
