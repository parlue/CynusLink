name: Patch scan order
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/patch-scan-order.yml' ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch main.cpp
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.cpp')
          s = p.read_text()
          old1 = '    Serial.printf("[CYNUS] connected %s\\n", cynusDev->getName().c_str());\n    Serial.println("[DISPLAY] waiting for a valid initial board before ChessLink scan");\n'
          new1 = '    Serial.printf("[CYNUS] connected %s\\n", cynusDev->getName().c_str());\n    displayPlayPending = false;\n    cynusDisplay("B Scan");\n    Serial.println("[DISPLAY] B Scan: Cynus connected, preparing physical board scan");\n'
          old2 = '    boardSyncRequestPending = true;\n    if (purpose == BOARD_SYNC_STARTUP) {\n        displayPlayPending = false;\n        cynusDisplay("B Scan");\n        if (delayMs < 400) delayMs = 400;\n        Serial.println("[DISPLAY] B Scan: waiting before physical startup scan");\n    }\n    boardSyncRequestAt = millis() + delayMs;\n'
          new2 = '    boardSyncRequestPending = true;\n    boardSyncRequestAt = millis() + delayMs;\n'
          assert old1 in s, 'connect anchor missing'
          assert old2 in s, 'requestBoardSync anchor missing'
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Commit source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.cpp
          git diff --cached --quiet || (git commit -m 'Restore original active board scan order [skip ci]' && git push)
