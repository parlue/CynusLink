name: Fix main source
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/fix-main.yml' ]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean misplaced B Scan blocks
        run: echo  | base64 -d | python
      - name: Commit corrected source
        run: git config user.name github-actions[bot] && git config user.email 41898282+github-actions[bot]@users.noreply.github.com && git add src/main.cpp && git diff --cached --quiet || (git commit -m 'Fix misplaced B Scan display statements [skip ci]' && git push)
