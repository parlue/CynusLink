name: Patch startup scan
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/patch-startup.yml' ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: echo  | base64 -d | python
      - name: Commit source
        run: git config user.name github-actions[bot] && git config user.email 41898282+github-actions[bot]@users.noreply.github.com && git add src/main.cpp && git diff --cached --quiet || (git commit -m 'Restore startup board scan sequencing [skip ci]' && git push)
