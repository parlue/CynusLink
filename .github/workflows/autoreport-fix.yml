name: Apply isolated auto-report fix
on:
  push:
    paths:
      - '.github/workflows/autoreport-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch auto-report supervision
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main.cpp')
          s = p.read_text()
          old = '''    if (clConnected && clNotify && boardSynced) {
              uint32_t interval = autoReportIntervalMs();
              if (interval && (lastAutoStatusAt==0 || (uint32_t)(millis()-lastAutoStatusAt)>=interval)) {
                  lastAutoStatusAt=millis();
                  sendStatus();
              }
          }
'''
          new = '''    if (clConnected && clNotify && boardSynced) {
              uint32_t interval = autoReportIntervalMs();
              if (interval && (lastAutoStatusAt==0 || (uint32_t)(millis()-lastAutoStatusAt)>=interval)) {
                  lastAutoStatusAt=millis();
                  // Auto-report is change-driven: poll at the configured interval,
                  // but never flood the host with an unchanged board position.
                  // Explicit S requests are still answered immediately in handleCL().
                  if (fenNow != lastFenSentToChessLink) sendStatus();
              }
          }
'''
          if old not in s:
              raise SystemExit('target block not found; refusing to modify')
          if s.count(old) != 1:
              raise SystemExit('target block is not unique; refusing to modify')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.cpp
          git diff --cached --check
          git commit -m 'fix: report ChessLink board state only on change'
          git push origin HEAD:main
