name: One-shot auto-report fix
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.issue.title == 'RUN_ONE_SHOT_AUTOREPORT_FIX_20260820'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch exactly one auto-report block
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main.cpp')
          s = p.read_text()
          old = '''    if (clConnected && clNotify && boardSynced) {
              uint32_t interval = autoReportIntervalMs();
              if (interval && (lastAutoStatusAt==0 || (uint32_t)(millis()-lastAutoStatusAt)>=interval)) {
                  lastAutoStatusAt=millis();
                  sendStatus();
              }
          }
          '''
          new = '''    if (clConnected && clNotify && boardSynced) {
              uint32_t interval = autoReportIntervalMs();
              if (interval && (lastAutoStatusAt==0 || (uint32_t)(millis()-lastAutoStatusAt)>=interval)) {
                  lastAutoStatusAt=millis();
                  if (fenNow != lastFenSentToChessLink) sendStatus();
              }
          }
          '''
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'refusing patch: target count={count}, expected 1')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/main.cpp
      - name: Commit isolated fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.cpp
          git commit -m 'fix: suppress unchanged ChessLink auto reports'
          git push origin HEAD:main
