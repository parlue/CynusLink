name: One-shot auto-report fix
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.issue.title == 'RUN_ONE_SHOT_AUTOREPORT_FIX_20260820'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch exactly one sendStatus call
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('src/main.cpp'); s=p.read_text(); old='            lastAutoStatusAt=millis();\n            sendStatus();'; new='            lastAutoStatusAt=millis();\n            if (fenNow != lastFenSentToChessLink) sendStatus();'; c=s.count(old); assert c==1, f'target count={c}, expected 1'; p.write_text(s.replace(old,new,1))"
          git diff --check
          git diff -- src/main.cpp
      - name: Commit isolated fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.cpp
          git commit -m 'fix: suppress unchanged ChessLink auto reports'
          git push origin HEAD:main
