name: one-shot-connect-play

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == 'run-connect-play-patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add play after Connect
        run: sed -i '/cynusDisplay("Connect");/a\            schedulePlayDisplay(1000);' src/main.cpp
      - name: Commit change
        run: git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add src/main.cpp && git diff --cached --quiet || (git commit -m 'fix: show play after ChessLink connect' && git push)
